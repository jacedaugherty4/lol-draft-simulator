[project]
name = "lol-draft-simulator"
version = "0.1.0"
description = "ML-powered League of Legends draft pick recommender"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.4",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = ["jupyter>=1.1.1", "pytest>=9.2.0", "ruff>=0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_sim"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
